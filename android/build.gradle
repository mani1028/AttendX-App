buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        gradlePluginVersion = "8.7.3"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Local React Native Android artifacts (includes hermes-engine AARs)
        maven {
            url = uri("../node_modules/react-native/android")
        }
        // Hermes prebuilt AARs (fallback to local SDK if not available on mavenCentral)
        maven {
            url = uri("../node_modules/react-native/sdks/hermes-engine/android")
        }
        // Local Android JSC AARs for the JSC fallback runtime
        maven {
            url = uri("../node_modules/jsc-android/dist")
        }
        maven {
            url = uri("../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
}
